<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>RimWorld English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RimEnglish">
<style>
:root{--bg:#0f0f10;--panel:#1d1d1f;--panel2:#242426;--text:#f4f4f5;--muted:#9b9ba1;--line:#343438}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
body{display:flex;justify-content:center}.app{width:min(100%,680px);min-height:100vh;padding:18px 18px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#18181a;color:var(--text);border-radius:14px;padding:10px 12px;font-size:14px;cursor:pointer}button:active{transform:scale(.98)}
.card-wrap{perspective:1200px;margin-top:8px}.card{position:relative;min-height:360px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:34px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.back{transform:rotateY(180deg)}.word{font-size:clamp(34px,8vw,54px);font-weight:750;letter-spacing:-1.5px}.emoji{font-size:42px;margin-top:14px}
.meaning{font-size:clamp(22px,5vw,30px);line-height:1.35;font-weight:650;max-width:520px}.example{margin-top:22px;color:#d0d0d5;font-size:18px;line-height:1.5}.hint{margin-top:22px;color:var(--muted);font-size:14px}
.zh{margin-top:14px;padding:10px 14px;border-radius:12px;background:#151517;color:#d9d9de;display:none}.zh.show{display:block}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 10px;color:var(--muted);font-size:14px}.bar{height:6px;background:#202024;border-radius:999px;overflow:hidden;margin-bottom:18px}.bar>div{height:100%;background:#e9e9ec;width:0%;transition:width .3s}
.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.actions button{font-size:22px;padding:16px;border-radius:18px}.unknown{background:#211719}.known{background:#172019}.speak{width:58px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stats{margin-top:18px;padding:16px;border:1px solid var(--line);background:#151517;border-radius:18px;color:#c8c8cd;font-size:14px;line-height:1.7}.small{font-size:12px;color:var(--muted)}
@media(max-width:520px){.app{padding:14px 14px 24px}.card{min-height:55vh}.face{border-radius:28px;padding:26px 22px}header{align-items:flex-start}}
</style>
</head>
<body><div class="app">
<header><div><div class="brand">RimWorld English</div><div class="sub">Think in scenes, not translations.</div></div><div class="controls"><button id="shuffleBtn">Shuffle</button><button id="resetBtn">Reset</button></div></header>
<div class="progress-row"><span id="counter">1/100</span><span id="score">✓ 0　✕ 0</span></div><div class="bar"><div id="barFill"></div></div>
<div class="card-wrap"><div class="card" id="card"><div class="face front"><div class="word" id="word"></div><div class="emoji" id="emoji"></div><div class="hint">Tap the card</div></div><div class="face back"><div class="meaning" id="meaning"></div><div class="example" id="example"></div><div class="zh" id="zh"></div><div class="hint">Tap again to flip back</div></div></div></div>
<div class="actions"><button class="unknown" id="unknownBtn">✕</button><button class="speak" id="speakBtn">🔊</button><button class="known" id="knownBtn">✓</button></div>
<div class="tools"><button id="hintBtn">Show Chinese hint</button><button id="missedBtn">Review missed</button></div>
<div class="stats" id="stats"></div><div class="small" style="margin-top:10px">Progress is saved on this device. No account or server needed.</div>
</div>
<script>
const CARDS = [{"word": "pawn", "emoji": "🧍🎮", "meaning": "a character in the game", "example": "Select a pawn.", "zh": "角色 / 单位 / 棋子"}, {"word": "colonist", "emoji": "🧍🏠", "meaning": "a person living in your colony", "example": "My colonist is sleeping.", "zh": "殖民者 / 定居者"}, {"word": "prisoner", "emoji": "🧍🔒", "meaning": "a person you keep locked up", "example": "Feed the prisoner.", "zh": "囚犯"}, {"word": "work", "emoji": "🧍🔨", "meaning": "things a pawn does as a job", "example": "He is working.", "zh": "工作"}, {"word": "priority", "emoji": "1️⃣2️⃣3️⃣", "meaning": "what should be done first", "example": "Set hauling to high priority.", "zh": "优先级"}, {"word": "schedule", "emoji": "🕒🛏️🔨", "meaning": "a plan for when to work, sleep, or relax", "example": "Check the pawn's schedule.", "zh": "作息表 / 日程"}, {"word": "assign", "emoji": "🧍➡️📋", "meaning": "give someone a job, item, or setting", "example": "Assign medicine.", "zh": "分配 / 指派"}, {"word": "draft", "emoji": "🧍➡️🎯", "meaning": "take direct control for combat", "example": "Draft the pawn.", "zh": "征召 / 战斗控制"}, {"word": "undraft", "emoji": "🎯➡️🧍", "meaning": "stop direct combat control", "example": "Undraft the pawn.", "zh": "解除征召"}, {"word": "idle", "emoji": "🧍💭", "meaning": "doing no work right now", "example": "The pawn is idle.", "zh": "空闲"}, {"word": "incapable", "emoji": "🚫🧍🔨", "meaning": "unable to do that kind of work", "example": "This pawn is incapable of cooking.", "zh": "无法从事"}, {"word": "skill", "emoji": "🧍📈", "meaning": "how good someone is at doing something", "example": "Her shooting skill is high.", "zh": "技能"}, {"word": "passion", "emoji": "🔥📈", "meaning": "strong interest that makes a skill grow faster", "example": "He has a passion for crafting.", "zh": "热情 / 兴趣"}, {"word": "trait", "emoji": "🧠🏷️", "meaning": "a lasting part of someone's personality", "example": "This pawn has a useful trait.", "zh": "特性"}, {"word": "mood", "emoji": "🙂😐😡", "meaning": "how good or bad a pawn feels", "example": "His mood is getting low.", "zh": "心情"}, {"word": "need", "emoji": "🧍🍚🛏️🎮", "meaning": "something a pawn must have or do", "example": "Check the pawn's needs.", "zh": "需求"}, {"word": "recreation", "emoji": "🧍🎮🎯", "meaning": "fun activities that help a pawn relax", "example": "The pawn needs recreation.", "zh": "娱乐"}, {"word": "rest", "emoji": "🧍🛏️", "meaning": "sleep or time to get energy back", "example": "She needs more rest.", "zh": "休息"}, {"word": "comfort", "emoji": "🪑🛏️🙂", "meaning": "how physically comfortable a pawn feels", "example": "A good chair improves comfort.", "zh": "舒适度"}, {"word": "beauty", "emoji": "🌷🖼️✨", "meaning": "how nice the surroundings look", "example": "Plants can improve beauty.", "zh": "美观"}, {"word": "outdoors", "emoji": "🧍➡️🌳", "meaning": "being outside, not inside a building", "example": "The pawn wants to be outdoors.", "zh": "户外"}, {"word": "mental break", "emoji": "🧠💥", "meaning": "a pawn loses control because mood is too low", "example": "A mental break has started.", "zh": "精神崩溃"}, {"word": "health", "emoji": "🧍❤️", "meaning": "the condition of a pawn's body", "example": "Open the Health tab.", "zh": "健康"}, {"word": "injury", "emoji": "🧍🩸", "meaning": "physical damage to the body", "example": "The pawn has a leg injury.", "zh": "伤势"}, {"word": "disease", "emoji": "🧍🤒", "meaning": "an illness affecting the body", "example": "The disease is getting worse.", "zh": "疾病"}, {"word": "infection", "emoji": "🩹🦠", "meaning": "germs growing in a wound or body part", "example": "The wound has an infection.", "zh": "感染"}, {"word": "immunity", "emoji": "🛡️🦠", "meaning": "the body's ability to defeat a disease", "example": "Immunity is rising.", "zh": "免疫力"}, {"word": "pain", "emoji": "🧍💢", "meaning": "the feeling caused by injury or illness", "example": "The pawn is in pain.", "zh": "疼痛"}, {"word": "consciousness", "emoji": "🧠👀", "meaning": "how awake and mentally active a pawn is", "example": "Low consciousness slows the pawn.", "zh": "意识"}, {"word": "manipulation", "emoji": "✋🔧", "meaning": "ability to use hands and arms", "example": "Injury reduced manipulation.", "zh": "操作能力"}, {"word": "moving", "emoji": "🦵➡️", "meaning": "ability to walk and move around", "example": "Moving is badly reduced.", "zh": "移动能力"}, {"word": "bleeding", "emoji": "🩸⬇️", "meaning": "losing blood from a wound", "example": "The pawn is bleeding.", "zh": "流血"}, {"word": "tend", "emoji": "🧑‍⚕️🩹🧍", "meaning": "give medical care", "example": "Tend the injured pawn.", "zh": "医治 / 包扎"}, {"word": "wall", "emoji": "🧱🧱🧱", "meaning": "a solid side of a room or building", "example": "Build a stone wall.", "zh": "墙"}, {"word": "door", "emoji": "🚪", "meaning": "something that opens so pawns can pass through", "example": "Put a door here.", "zh": "门"}, {"word": "roof", "emoji": "🏠☔", "meaning": "the top covering of a building", "example": "The room needs a roof.", "zh": "屋顶"}, {"word": "floor", "emoji": "🧍⬇️⬜", "meaning": "the surface people walk on inside a room", "example": "Clean the floor.", "zh": "地板"}, {"word": "furniture", "emoji": "🛏️🪑🛋️", "meaning": "movable things used in rooms", "example": "Build some furniture.", "zh": "家具"}, {"word": "bed", "emoji": "🛏️😴", "meaning": "a place where a pawn sleeps", "example": "Assign this bed.", "zh": "床"}, {"word": "sleeping spot", "emoji": "⬜😴", "meaning": "a simple marked place for sleeping", "example": "Place a sleeping spot.", "zh": "睡眠点"}, {"word": "room", "emoji": "🧱🧍🧱", "meaning": "an enclosed space inside a building", "example": "This room is too small.", "zh": "房间"}, {"word": "bedroom", "emoji": "🛏️🚪", "meaning": "a room mainly used for sleeping", "example": "Give the pawn a bedroom.", "zh": "卧室"}, {"word": "barracks", "emoji": "🛏️🛏️🛏️", "meaning": "one room where several pawns sleep", "example": "The colonists sleep in a barracks.", "zh": "集体宿舍"}, {"word": "dining room", "emoji": "🍽️🪑", "meaning": "a room where pawns eat meals", "example": "Make a bigger dining room.", "zh": "餐厅"}, {"word": "recreation room", "emoji": "🎮🎱🙂", "meaning": "a room used for fun and relaxation", "example": "Add a recreation room.", "zh": "娱乐室"}, {"word": "workshop", "emoji": "🔨⚙️🏠", "meaning": "a room where things are made", "example": "Put the bench in the workshop.", "zh": "工作间"}, {"word": "storage", "emoji": "📦📦🏠", "meaning": "a place or system for keeping items", "example": "Move the steel to storage.", "zh": "储存"}, {"word": "stockpile", "emoji": "📦📦⬜", "meaning": "an area on the ground where items are stored", "example": "Create a stockpile here.", "zh": "储存区"}, {"word": "shelf", "emoji": "🗄️📦", "meaning": "a piece of furniture used to store items", "example": "Put medicine on the shelf.", "zh": "货架"}, {"word": "zone", "emoji": "⬜⬜⬜", "meaning": "a marked area with a special purpose", "example": "Create a growing zone.", "zh": "区域"}, {"word": "home area", "emoji": "🏠⭕", "meaning": "the area your colony treats as home territory", "example": "Expand the home area.", "zh": "家园区域"}, {"word": "resource", "emoji": "🪵🪨⚙️", "meaning": "something useful for building or making things", "example": "We need more resources.", "zh": "资源"}, {"word": "steel", "emoji": "🔩🏗️", "meaning": "a common metal used for buildings and machines", "example": "We need more steel.", "zh": "钢铁"}, {"word": "wood", "emoji": "🌳➡️🪵", "meaning": "material taken from trees", "example": "Build the door from wood.", "zh": "木材"}, {"word": "component", "emoji": "⚙️🔧", "meaning": "a machine part needed for advanced construction", "example": "The cooler needs components.", "zh": "零部件"}, {"word": "advanced component", "emoji": "⚙️✨", "meaning": "a high-level machine part for advanced technology", "example": "Craft an advanced component.", "zh": "高级零部件"}, {"word": "cloth", "emoji": "🧵👕", "meaning": "fabric used to make clothes and other items", "example": "Use cloth to make a shirt.", "zh": "布料"}, {"word": "leather", "emoji": "🐄➡️🧥", "meaning": "material made from animal skin", "example": "Make a jacket from leather.", "zh": "皮革"}, {"word": "stone", "emoji": "🪨", "meaning": "hard natural material used for building", "example": "Stone is good for strong walls.", "zh": "石材"}, {"word": "stone block", "emoji": "🪨➡️🧱", "meaning": "stone cut into useful building pieces", "example": "Build with stone blocks.", "zh": "石块"}, {"word": "chunk", "emoji": "🪨⬛", "meaning": "a large raw piece of stone or metal debris", "example": "Haul the chunk away.", "zh": "大块石料 / 残骸"}, {"word": "craft", "emoji": "🧍🛠️📦", "meaning": "make an item by hand or at a workbench", "example": "Craft a new weapon.", "zh": "制作"}, {"word": "bill", "emoji": "📋➡️🔨", "meaning": "an order telling a workbench what to make", "example": "Add a bill to make meals.", "zh": "生产任务"}, {"word": "ingredient", "emoji": "🥔🥩➡️🍲", "meaning": "something used to make food or another item", "example": "We need more ingredients.", "zh": "原料"}, {"word": "haul", "emoji": "🧍📦➡️storage", "meaning": "carry an item to another place, usually storage", "example": "Haul the steel.", "zh": "搬运"}, {"word": "hauling", "emoji": "🧍📦➡️📦", "meaning": "the work of moving items around the colony", "example": "Set hauling to high priority.", "zh": "搬运工作"}, {"word": "clean", "emoji": "🧹✨", "meaning": "remove dirt, blood, or other mess", "example": "Clean the room.", "zh": "清洁"}, {"word": "construct", "emoji": "🧍🔨➡️🏠", "meaning": "build something", "example": "Construct a new wall.", "zh": "建造"}, {"word": "repair", "emoji": "🔧🏠", "meaning": "fix something that is damaged", "example": "Repair the damaged turret.", "zh": "修理"}, {"word": "deconstruct", "emoji": "🏠➡️🧱", "meaning": "take a building apart and recover materials", "example": "Deconstruct this wall.", "zh": "拆除"}, {"word": "food", "emoji": "🍚🥩🥔", "meaning": "anything a pawn can eat", "example": "We are running out of food.", "zh": "食物"}, {"word": "meal", "emoji": "🥘🍽️", "meaning": "food prepared and ready to eat", "example": "The pawn ate a meal.", "zh": "餐食"}, {"word": "raw food", "emoji": "🥔🥩", "meaning": "food that has not been cooked", "example": "Store raw food in the freezer.", "zh": "生食"}, {"word": "simple meal", "emoji": "🥘", "meaning": "a basic cooked meal", "example": "Cook ten simple meals.", "zh": "简单餐"}, {"word": "fine meal", "emoji": "🍽️✨", "meaning": "a better meal that improves mood", "example": "Fine meals improve mood.", "zh": "精致餐"}, {"word": "nutrient paste", "emoji": "🥣⚙️", "meaning": "food made automatically by a paste dispenser", "example": "The pawn ate nutrient paste.", "zh": "营养膏"}, {"word": "cook", "emoji": "🧍🍳", "meaning": "prepare food using heat", "example": "Cook some meals.", "zh": "烹饪"}, {"word": "butcher", "emoji": "🦌🔪➡️🥩", "meaning": "cut a dead animal into meat and leather", "example": "Butcher the deer.", "zh": "屠宰"}, {"word": "crop", "emoji": "🌱➡️🌽", "meaning": "a plant grown for food or materials", "example": "The crop is ready.", "zh": "农作物"}, {"word": "growing zone", "emoji": "⬜🌱🌱", "meaning": "an area where pawns plant and grow crops", "example": "Create a growing zone.", "zh": "种植区"}, {"word": "harvest", "emoji": "🌾✂️➡️📦", "meaning": "collect a mature plant or crop", "example": "Harvest the rice.", "zh": "收获"}, {"word": "animal", "emoji": "🐄🐕🐓", "meaning": "a non-human living creature", "example": "The animal is hungry.", "zh": "动物"}, {"word": "tame", "emoji": "🐺➡️🐕", "meaning": "make a wild animal accept humans", "example": "Try to tame the muffalo.", "zh": "驯服"}, {"word": "train", "emoji": "🧍🐕📈", "meaning": "teach an animal to do specific things", "example": "Train the dog to haul.", "zh": "训练"}, {"word": "pen", "emoji": "🐄🔲", "meaning": "an enclosed area for farm animals", "example": "Move the animals into the pen.", "zh": "牲畜栏"}, {"word": "raid", "emoji": "⚠️👥➡️🏠", "meaning": "an organized enemy attack on your colony", "example": "A raid has begun.", "zh": "袭击"}, {"word": "raider", "emoji": "👤🔫➡️🏠", "meaning": "an enemy taking part in a raid", "example": "The raider is approaching.", "zh": "袭击者"}, {"word": "weapon", "emoji": "🔫🗡️", "meaning": "something used to attack or fight", "example": "Equip a better weapon.", "zh": "武器"}, {"word": "turret", "emoji": "🤖🔫", "meaning": "a fixed weapon that can shoot enemies", "example": "Build a turret near the gate.", "zh": "炮塔"}, {"word": "threat", "emoji": "⚠️💀", "meaning": "something dangerous that may harm the colony", "example": "A new threat has appeared.", "zh": "威胁"}, {"word": "attack", "emoji": "👤➡️💥", "meaning": "try to hurt or damage someone or something", "example": "Attack the raider.", "zh": "攻击"}, {"word": "rescue", "emoji": "🧍➡️🛏️", "meaning": "carry an injured pawn to a safe bed", "example": "Rescue the downed colonist.", "zh": "救援"}, {"word": "capture", "emoji": "👤🔒", "meaning": "take an enemy and make them a prisoner", "example": "Capture the wounded raider.", "zh": "俘虏"}, {"word": "recruit", "emoji": "🔒➡️🧍🏠", "meaning": "convince a prisoner to join your colony", "example": "Try to recruit the prisoner.", "zh": "招募"}, {"word": "equip", "emoji": "🧍➡️🔫", "meaning": "give a pawn a weapon to use", "example": "Equip the rifle.", "zh": "装备"}, {"word": "apparel", "emoji": "👕🧥👖", "meaning": "clothing worn by a pawn", "example": "This apparel is worn out.", "zh": "服装"}, {"word": "temperature", "emoji": "🌡️🔥❄️", "meaning": "how hot or cold a place is", "example": "Check the room temperature.", "zh": "温度"}, {"word": "power", "emoji": "⚡🏠", "meaning": "electricity used by machines and buildings", "example": "The base has no power.", "zh": "电力"}, {"word": "battery", "emoji": "⚡🔋", "meaning": "a device that stores electricity", "example": "The battery is fully charged.", "zh": "蓄电池"}, {"word": "research", "emoji": "🧠📚➡️🔬", "meaning": "work that unlocks new technology", "example": "Start a new research project.", "zh": "研究"}];
const KEY="rimworld_english_progress_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
if(!state.order)state.order=CARDS.map((_,i)=>i);if(!state.results)state.results={};if(typeof state.pos!=="number")state.pos=0;
let order=state.order.slice(),pos=Math.min(state.pos,Math.max(0,order.length-1));
const $=id=>document.getElementById(id),cardEl=$("card");
function save(){state.order=order;state.pos=pos;localStorage.setItem(KEY,JSON.stringify(state))}
function currentIndex(){return order[pos]} function current(){return CARDS[currentIndex()]}
function render(){if(!order.length)order=CARDS.map((_,i)=>i);if(pos>=order.length)pos=0;const c=current();$("word").textContent=c.word;$("emoji").textContent=c.emoji;$("meaning").textContent=c.meaning;$("example").textContent=c.example;$("zh").textContent=c.zh;$("zh").classList.remove("show");$("hintBtn").textContent="Show Chinese hint";cardEl.classList.remove("flipped");$("counter").textContent=`${pos+1}/${order.length}`;$("barFill").style.width=`${((pos+1)/order.length)*100}%`;const vals=Object.values(state.results),known=vals.filter(v=>v==="known").length,missed=vals.filter(v=>v==="missed").length;$("score").textContent=`✓ ${known}　✕ ${missed}`;$("stats").innerHTML=`<b>Progress</b><br>Known: ${known} / 100<br>Missed: ${missed} / 100<br>Unseen: ${100-known-missed} / 100`;save()}
function next(){pos++;if(pos>=order.length)pos=0;render()} function mark(result){state.results[currentIndex()]=result;save();next()}
cardEl.addEventListener("click",()=>cardEl.classList.toggle("flipped"));$("knownBtn").addEventListener("click",()=>mark("known"));$("unknownBtn").addEventListener("click",()=>mark("missed"));
$("speakBtn").addEventListener("click",()=>{const c=current();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`${c.word}. ${c.example}`);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)});
$("hintBtn").addEventListener("click",()=>{const z=$("zh");z.classList.toggle("show");$("hintBtn").textContent=z.classList.contains("show")?"Hide Chinese hint":"Show Chinese hint";cardEl.classList.add("flipped")});
$("shuffleBtn").addEventListener("click",()=>{order=CARDS.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render()});
$("missedBtn").addEventListener("click",()=>{const missed=CARDS.map((_,i)=>i).filter(i=>state.results[i]==="missed");if(!missed.length){alert("No missed cards yet.");return}order=missed;pos=0;render()});
$("resetBtn").addEventListener("click",()=>{if(confirm("Reset all learning progress?")){localStorage.removeItem(KEY);state={order:CARDS.map((_,i)=>i),results:{},pos:0};order=state.order.slice();pos=0;render()}});
document.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();cardEl.classList.toggle("flipped")}if(e.key==="ArrowRight")mark("known");if(e.key==="ArrowLeft")mark("missed");if(e.key.toLowerCase()==="s")$("speakBtn").click()});
render();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
